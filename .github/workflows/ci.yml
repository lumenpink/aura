name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Configurar Node.js (Requisito Wrangler)
        uses: actions/setup-node@v6

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Audit Dependencies
        run: bun audit --audit-level=critical

      - name: Run Code Quality Checks (Biome)
        run: bun x biome check .

      - name: Verify TypeScript Types (Root & Scripts)
        run: bunx tsc --noEmit

      - name: Verify TypeScript Types (Shared Package)
        run: bunx tsc --noEmit --project packages/shared/tsconfig.json

      - name: Verify TypeScript Types (UI Package)
        run: bunx tsc --noEmit --project packages/ui/tsconfig.json

      - name: Verify TypeScript Types (Fluxo Backend)
        run: bunx tsc --noEmit --project apps/fluxo-backend/tsconfig.json

      - name: Verify TypeScript Types (Traço Backend)
        run: bunx tsc --noEmit --project apps/traco-backend/tsconfig.json

      - name: Verify TypeScript Types (Pulso Backend)
        run: bunx tsc --noEmit --project apps/pulso-backend/tsconfig.json

      - name: Run Unit & Integration Tests/Coverage
        run: bun test --coverage --coverage-threshold=85

      - name: Verify Fluxo Frontend Compilation
        run: bun run --cwd apps/fluxo-frontend build

      - name: Verify Traço Frontend Compilation
        run: bun run --cwd apps/traco-frontend build

      - name: Verify Pulso Frontend Compilation
        run: bun run --cwd apps/pulso-frontend build

      - name: Verify PDF Documentation Compilation
        run: bun run pdf:docs

