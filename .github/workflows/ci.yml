name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configurar Node.js (Requisito Wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Audit Dependencies
        run: bun audit --audit-level=critical

      - name: Run Code Quality Checks (Biome)
        run: bun x biome check .

      - name: Verify TypeScript Types (Root & Scripts)
        run: bunx tsc --noEmit

      - name: Verify TypeScript Types (Shared Package)
        run: bunx tsc --noEmit --project packages/shared/tsconfig.json

      - name: Verify TypeScript Types (Backend)
        run: bunx tsc --noEmit --project apps/backend/tsconfig.json

      - name: Run Unit & Integration Tests/Coverage
        run: bun test --coverage --coverage-threshold=85

      - name: Verify Frontend Compilation
        run: bun run --cwd apps/frontend build

      - name: Verify PDF Documentation Compilation
        run: bun run pdf:docs

