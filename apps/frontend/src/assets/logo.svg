<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Luminous violet to platinum linear gradient -->
    <linearGradient id="auraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing refraction/secondary eclipse gradient -->
    <linearGradient id="refractionGradient" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.1" />
    </linearGradient>

    <!-- Radial glow filter for luxury halo effect -->
    <filter id="auraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pure blur filter for soft glow overlays -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>
  </defs>

  <!-- Glow halo under the primary ring -->
  <circle cx="50" cy="50" r="24" stroke="url(#auraGradient)" stroke-width="3" opacity="0.15" filter="url(#auraGlow)" />

  <!-- Refracted offset ring (blurred for soft glow refraction effect) -->
  <circle cx="52" cy="52" r="24" stroke="url(#refractionGradient)" stroke-width="4.5" filter="url(#softGlow)" opacity="0.65" />

  <!-- Primary central ring (slightly thicker for definition) -->
  <circle cx="50" cy="50" r="24" stroke="url(#auraGradient)" stroke-width="2.2" />

  <!-- 8 Orbital Solar Rays with brightness gradient peaking toward the bottom-right -->
  <circle cx="50" cy="12" r="2.8" fill="url(#auraGradient)" opacity="0.45" />
  <circle cx="77" cy="23" r="2.8" fill="url(#auraGradient)" opacity="0.65" />
  <circle cx="88" cy="50" r="2.8" fill="url(#auraGradient)" opacity="0.85" />
  <circle cx="77" cy="77" r="2.8" fill="url(#auraGradient)" opacity="1.0" />
  <circle cx="50" cy="88" r="2.8" fill="url(#auraGradient)" opacity="0.85" />
  <circle cx="23" cy="77" r="2.8" fill="url(#auraGradient)" opacity="0.65" />
  <circle cx="12" cy="50" r="2.8" fill="url(#auraGradient)" opacity="0.45" />
  <circle cx="23" cy="23" r="2.8" fill="url(#auraGradient)" opacity="0.25" />
</svg>
